<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Números inteiros e sequências — vídeo-resumo</title>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: "media", theme: { extend: { fontFamily: { sans: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'] } } } }</script>
    <style type="text/tailwindcss">
        @layer components{
 .btn{@apply cursor-pointer rounded-lg bg-slate-800 px-4 py-2 font-semibold text-stone-100 focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-amber-300 dark:bg-stone-100 dark:text-slate-900}
 .pos{@apply text-[#7fd6b0]} .neg{@apply text-[#ff8f7a]} .hl{@apply text-amber-300}
 li.it{@apply max-w-[46ch] -translate-x-2 border-l-[3px] border-amber-300 pl-4 text-[clamp(16px,1.9vw,22px)] leading-snug opacity-0 transition duration-500 motion-reduce:transition-none}
 li.it.on{@apply translate-x-0 opacity-100}
 #v svg{@apply h-auto max-h-[380px] w-full}
 #v svg text{font-family:inherit}
 .big{@apply text-center text-[clamp(28px,5vw,56px)] font-extrabold leading-[1.3]}
 .chips{@apply flex flex-wrap justify-center gap-2.5}
 .chip{@apply rounded-xl bg-[#1b3a5c] px-4 py-2.5 text-[clamp(16px,2.2vw,26px)] font-semibold}
 .zset{@apply w-full max-w-[420px] rounded-[50%] border-[3px] border-dashed border-amber-300 px-11 py-9 text-center text-[22px]}
 .nset{@apply mt-2.5 rounded-[50%] border-[3px] border-[#7fd6b0] px-5 py-6}
 table{@apply text-[clamp(20px,3vw,34px)] font-bold}
 td,th{@apply border-2 border-[#3a5a7c] px-[18px] py-2 text-center}
 #bar i{@apply relative h-[9px] flex-1 cursor-pointer overflow-hidden rounded-[5px] bg-slate-400/40 focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-amber-300}
 #bar i.past{@apply bg-amber-300}
 #bar i b{@apply absolute inset-0 origin-left bg-amber-300}
 #quiz h2{@apply max-w-[30ch] text-[clamp(22px,3.4vw,36px)] font-extrabold leading-tight}
 .qk{@apply font-semibold text-amber-300}
 .opt{@apply w-full max-w-[560px] cursor-pointer rounded-lg bg-[#1b3a5c] px-[18px] py-3 text-left text-[clamp(16px,2vw,21px)] font-semibold text-[#f2efe6] hover:enabled:bg-[#27507d] disabled:cursor-default disabled:opacity-75 focus-visible:outline focus-visible:outline-[3px] focus-visible:outline-amber-300}
 .opt.ok{@apply bg-[#1f6b55] opacity-100}
 .opt.no{@apply bg-[#8a3a2e] opacity-100}
 .fb{@apply min-h-[2.6em] max-w-[52ch] text-[17px] leading-snug}
 #qn{@apply cursor-pointer rounded-lg bg-amber-300 px-4 py-2 font-semibold text-[#10243a]}
 #stage.s1{@apply md:min-h-[560px]}
 #stage.s1 #v{@apply md:self-start}
}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.4s .3s forwards}
@keyframes d{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}
</style>
</head>

<body
    class="flex flex-col items-center bg-slate-100 p-4 pb-[calc(1rem+env(safe-area-inset-bottom,0px))] pt-[calc(1rem+env(safe-area-inset-top,0px))] font-sans text-slate-800 dark:bg-slate-950 dark:text-slate-200">
    <div class="w-full max-w-[1100px]">
        <div id="stage"
            class="relative grid items-center gap-7 overflow-hidden rounded-2xl border-4 border-[#7a5c3a] bg-[#10243a] p-5 text-[#f2efe6] md:min-h-[480px] md:grid-cols-[1fr_1.05fr] md:px-9 md:py-8">
            <div>
                <h1 id="t" class="mb-4 text-[clamp(26px,3.6vw,42px)] font-extrabold leading-tight"></h1>
                <ul id="items" class="grid gap-3"></ul>
            </div>
            <div id="v" class="flex min-w-0 items-center justify-center"></div>
            <div id="quiz" role="group" aria-live="polite"
                class="absolute inset-0 z-[2] hidden flex-col items-center gap-3 overflow-auto bg-[#10243af5] p-6 text-center [justify-content:safe_center]">
            </div>
            <video id="vid" playsinline controls preload="auto" src="src/IMG/videoteste1.mp4"
                class="z-[1] mx-auto hidden w-full max-w-[360px] rounded-xl border-[3px] border-amber-300 bg-black object-contain md:absolute md:bottom-4 md:right-4 md:mx-0 md:w-[45%] md:max-w-none col-span-full"></video>
            <div id="start"
                class="absolute inset-0 z-[3] flex flex-col items-center justify-center gap-4 bg-[#10243aee] p-5 text-center">
                <h2 class="text-[clamp(28px,5vw,52px)] font-extrabold leading-tight">Números inteiros e sequências</h2>
                <p class="max-w-[44ch] opacity-85">Vídeo-resumo do Capítulo 1 · 7º ano. Quinze cenas explicam cada
                    conceito, com narração opcional e três perguntas para refletir ao final de cada uma, com dica se
                    você errar.</p>
                <button id="go" class="btn !bg-amber-300 px-8 py-3.5 text-[22px] !text-[#10243a]">Assistir</button>
            </div>
        </div>
        <div id="gate"
            class="mt-3 hidden flex-wrap items-center justify-center gap-3 rounded-xl border-2 border-amber-300 bg-amber-300/15 p-3">
            <span class="font-semibold">Fim da cena. Pronto para refletir?</span>
            <button id="redo" class="btn">Rever cena</button>
            <button id="ok" class="btn !bg-amber-300 !text-[#10243a]">Prosseguir para as perguntas</button>
        </div>
        <p id="cap" aria-live="polite" class="mt-3.5 min-h-[3.6em] px-0.5 text-[17px] leading-relaxed"></p>
        <div id="bar" class="mt-2.5 flex gap-[3px]"></div>
        <div class="mt-3 flex flex-wrap items-center gap-2.5">
            <button id="prev" class="btn" aria-label="Cena anterior">Anterior</button>
            <button id="pp" class="btn">Pausar</button>
            <button id="next" class="btn" aria-label="Próxima cena">Próxima</button>
            <label class="flex items-center gap-1.5 text-[15px]">Velocidade <select id="spd" class="btn">
                    <option value="0.8">0,8×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.25">1,25×</option>
                    <option value="1.5">1,5×</option>
                </select></label>
            <label class="flex items-center gap-1.5 text-[15px]"><input type="checkbox" id="vox"> Narração em
                voz</label>
            <span class="ml-auto text-[15px] opacity-80"><span id="score"></span> · <span id="count"></span></span>
        </div>
    </div>
    <script>
        const P = "#7fd6b0", N = "#ff8f7a", Y = "#ffd166", C = "#f2efe6";
        const pos = s => `<b class="pos">${s}</b>`, neg = s => `<b class="neg">${s}</b>`;
        const f = v => v < 0 ? "−" + (-v) : v > 0 ? "+" + v : "0";
        function nl(a, b, pts = [], arcs = []) {
            const x = v => 30 + (v - a) / (b - a) * 580;
            let s = `<svg viewBox="0 0 640 170" role="img" aria-label="Reta numerada de ${a} a ${b}"><line x1="14" y1="100" x2="626" y2="100" stroke="${C}" stroke-width="3"/>`;
            for (let v = a; v <= b; v++)s += `<line x1="${x(v)}" y1="92" x2="${x(v)}" y2="108" stroke="${C}" stroke-width="2"/><text x="${x(v)}" y="132" text-anchor="middle" fill="${v < 0 ? N : v > 0 ? P : Y}" font-size="17">${f(v)}</text>`;
            arcs.forEach(([p, q, l, c]) => {
                const m = (x(p) + x(q)) / 2, h = Math.min(Math.abs(x(q) - x(p)) * .6, 120), k = c || Y;
                s += `<path class="draw" pathLength="1" d="M${x(p)} 92 Q${m} ${92 - h * 1.6} ${x(q)} 92" fill="none" stroke="${k}" stroke-width="3.5"/><text x="${m}" y="${92 - h * .8 - 8}" text-anchor="middle" fill="${k}" font-size="20" font-weight="700">${l}</text>`
            });
            pts.forEach(([v, l, c]) => { s += `<circle cx="${x(v)}" cy="100" r="8" fill="${c || Y}"/><text x="${x(v)}" y="160" text-anchor="middle" fill="${c || Y}" font-size="18" font-weight="700">${l}</text>` });
            return s + "</svg>";
        }
        function plano() {
            const x = v => 270 + v * 50, y = v => 200 - v * 50; let s = `<svg viewBox="0 0 540 400" role="img" aria-label="Plano cartesiano">`;
            for (let i = -5; i <= 5; i++)s += `<line x1="${x(i)}" y1="0" x2="${x(i)}" y2="400" stroke="#2c4a6a"/>`;
            for (let i = -4; i <= 4; i++)s += `<line x1="0" y1="${y(i)}" x2="540" y2="${y(i)}" stroke="#2c4a6a"/>`;
            s += `<line x1="0" y1="200" x2="540" y2="200" stroke="${C}" stroke-width="3"/><line x1="270" y1="0" x2="270" y2="400" stroke="${C}" stroke-width="3"/><text x="522" y="190" fill="${C}" font-size="20">x</text><text x="280" y="20" fill="${C}" font-size="20">y</text><text x="276" y="216" fill="${Y}" font-size="16">O (0, 0)</text>`;
            [[2, 1, "A(2, 1)", P], [-2, 3, "B(−2, 3)", Y], [-3, -2, "C(−3, −2)", N], [3, -2, "D(3, −2)", Y]].forEach(([a, b, l, c]) => s += `<circle cx="${x(a)}" cy="${y(b)}" r="8" fill="${c}"/><text x="${x(a) + 11}" y="${y(b) - 10}" fill="${c}" font-size="18" font-weight="700">${l}</text>`);
            return s + "</svg>";
        }
        const S = [
            {
                t: "Números inteiros e sequências",
                n: "Neste vídeo você revê o Capítulo 1. Vamos ver os números com sinal, a reta numerada, o módulo, os opostos, as quatro operações, a potenciação, as expressões numéricas, o plano cartesiano e as sequências.",
                i: ["Números com sinal: " + pos("+") + " e " + neg("−"), "Conjunto, reta, módulo e opostos", "Operações, potências e expressões", "Plano cartesiano e sequências"],
                v: nl(-3, 3, [[-3, "−3", N], [0, "0", Y], [3, "+3", P]])
            },
            {
                t: "Positivo, negativo e zero",
                n: "Usamos números positivos e negativos em situações do dia a dia. Na temperatura, acima de zero grau é positivo e abaixo é negativo. Na altitude, o nível do mar é zero. No fuso horário, Brasília está menos três horas em relação a Londres. No banco, crédito é positivo e dívida é negativa. O zero não é positivo nem negativo.",
                i: ["Temperatura: acima de 0 °C é " + pos("positiva") + ", abaixo é " + neg("negativa") + " (São Joaquim: −5 °C)", "Altitude: Everest " + pos("+8 848 m") + "; fossa das Marianas " + neg("−11 034 m"), "Fuso horário: Brasília em relação a Londres é " + neg("−3"), "Dinheiro: saldo " + pos("+R$ 250") + ", dívida " + neg("−R$ 60"), "O zero não é positivo nem negativo"],
                v: `<div class="chips"><span class="chip neg">−5 °C</span><span class="chip pos">+44,7 °C</span><span class="chip pos">+8 848 m</span><span class="chip neg">−11 034 m</span><span class="chip neg">−3 h</span><span class="chip neg">−R$ 60,00</span></div>`
            },
            {
                t: "O conjunto dos números inteiros",
                n: "Os números naturais são zero, um, dois, três e assim por diante. Juntando os naturais com os inteiros negativos, obtemos o conjunto dos números inteiros, representado pela letra Z. Menos quatro pertence a Z, mas não pertence a N. Todo natural é inteiro, mas nem todo inteiro é natural.",
                i: ["ℕ = {0, 1, 2, 3, …}", "ℤ = {…, −2, −1, 0, 1, 2, …}", "−4 ∈ ℤ (pertence) e −4 ∉ ℕ (não pertence)", "Todo natural é inteiro; nem todo inteiro é natural"],
                v: `<div class="zset"><span class="neg">… −3 −2 −1</span><div class="nset"><span class="pos">ℕ: 0 1 2 3 …</span></div><b class="hl">ℤ</b></div>`
            },
            {
                t: "Representação na reta numerada",
                n: "Para representar os inteiros em uma reta, escolhemos um ponto como origem, o zero, e uma unidade de medida. Marcamos os pontos sempre com a mesma unidade. À direita ficam os positivos e à esquerda os negativos. O número que corresponde a um ponto é a abscissa dele. Nem todo ponto da reta é um número inteiro.",
                i: ["Origem O no zero e uma unidade de medida", "Direita: sentido " + pos("positivo") + "; esquerda: sentido " + neg("negativo"), "Abscissa: o número associado ao ponto", "Nem todo ponto da reta é inteiro"],
                v: nl(-4, 4, [[0, "O", Y], [3, "X: +3", P], [-1, "Y: −1", N]])
            },
            {
                t: "Módulo ou valor absoluto",
                n: "O módulo de um número inteiro é a distância dele até a origem. Menos dois e mais dois estão a duas unidades do zero, então o módulo de cada um é dois. O módulo nunca é negativo: é positivo, ou zero quando o número é zero.",
                i: ["Módulo = distância até o zero", "|−2| = 2 e |+2| = 2", "|0| = 0", "O módulo nunca é negativo"],
                v: nl(-3, 3, [[-2, "−2", N], [2, "+2", P]], [[-2, 0, "2", N], [0, 2, "2", P]])
            },
            {
                t: "Números opostos ou simétricos",
                n: "Dois números são opostos quando estão à mesma distância do zero, em lados diferentes. O oposto de quatro é menos quatro. O oposto de menos nove é nove. O oposto de zero é o próprio zero. Por causa dessa simetria, os inteiros também são chamados de inteiros relativos.",
                i: ["Oposto de 4 é −4", "Oposto de −9: −(−9) = +9", "O oposto de 0 é 0", "Simetria em relação à origem"],
                v: nl(-4, 4, [[-3, "−3", N], [3, "+3", P], [0, "0", Y]], [[-3, 3, "opostos"]])
            },
            {
                t: "Comparação de números inteiros",
                n: "Comparar é dizer qual número é maior, menor ou se são iguais. Na reta, o maior número fica sempre mais à direita. Mais dois é maior que menos três. Entre dois negativos, o maior é o que tem menor módulo: menos um é maior que menos dois. Todo negativo é menor que zero.",
                i: ["Maior = mais à direita na reta", "+2 > −3 (crédito de 2 é melhor que débito de 3)", "−1 > −2 (−1 °C é mais quente que −2 °C)", "−4 < 0 e 0 < +1"],
                v: nl(-4, 4, [[-3, "−3", N], [-2, "−2", N], [-1, "−1", N], [2, "+2", P]])
            },
            {
                t: "Adição de números inteiros",
                n: "Na adição, se os sinais são iguais, somamos os módulos e mantemos o sinal: menos um mais menos três dá menos quatro. Se os sinais são diferentes, subtraímos os módulos e o resultado leva o sinal do número de maior módulo: menos dois mais cinco dá mais três. Números opostos somam zero, e o zero é o elemento neutro.",
                i: ["Sinais iguais: soma os módulos, mantém o sinal: (−1) + (−3) = " + neg("−4"), "Sinais diferentes: subtrai os módulos, sinal do maior módulo: (−2) + (+5) = " + pos("+3"), "Opostos somam zero: (−4) + (+4) = 0", "Zero é o elemento neutro"],
                v: nl(-4, 4, [[-2, "−2", N], [3, "+3", P]], [[-2, 3, "+5", P]])
            },
            {
                t: "Subtração de números inteiros",
                n: "Subtrair é somar com o oposto. Menos nove menos mais dois é o mesmo que menos nove mais menos dois, que dá menos onze. Mais quarenta e oito menos menos oitenta e cinco vira mais quarenta e oito mais oitenta e cinco, que dá cento e trinta e três. Nos inteiros a subtração é sempre possível.",
                i: ["Subtrair = somar o oposto", "(−9) − (+2) = (−9) + (−2) = " + neg("−11"), "(+48) − (−85) = (+48) + (+85) = " + pos("+133"), "3 − 5 é impossível em ℕ, mas em ℤ dá " + neg("−2")],
                v: nl(-4, 4, [[3, "3", P], [-2, "−2", N]], [[3, -2, "−5", N]])
            },
            {
                t: "Multiplicação e divisão",
                n: "Na multiplicação e na divisão, sinais iguais dão resultado positivo e sinais diferentes dão resultado negativo. Se um fator é zero, o produto é zero. A divisão é a operação inversa da multiplicação. Dividir por zero é impossível. Com vários fatores, se o número de fatores negativos é par, o produto é positivo; se é ímpar, é negativo.",
                i: ["Sinais iguais: " + pos("+") + "; sinais diferentes: " + neg("−"), "Fator zero: produto zero", "Divisão é a inversa: (−12) ÷ (+3) = −4, pois (−4)·(+3) = −12", "Dividir por 0 é impossível", "Fatores negativos pares → " + pos("+") + "; ímpares → " + neg("−")],
                v: `<table><tr><th>×</th><th>+</th><th>0</th><th>−</th></tr><tr><th>+</th><td class="pos">+</td><td>0</td><td class="neg">−</td></tr><tr><th>0</th><td>0</td><td>0</td><td>0</td></tr><tr><th>−</th><td class="neg">−</td><td>0</td><td class="pos">+</td></tr></table>`
            },
            {
                t: "Potenciação",
                n: "Potenciação é multiplicar fatores iguais. Com base negativa, o sinal depende do expoente: expoente par dá resultado positivo e ímpar dá negativo. Menos cinco ao quadrado é vinte e cinco, mas menos cinco ao quadrado sem parênteses é menos vinte e cinco, pois só o cinco é elevado. Zero elevado a um expoente natural diferente de zero é zero, e qualquer base diferente de zero elevada a zero é um.",
                i: ["(−5)² = (−5)·(−5) = " + pos("+25") + "; (−2)³ = " + neg("−8"), "Expoente par → positivo; ímpar com base negativa → negativo", "(−5)² ≠ −5²: sem parênteses só o 5 é elevado, −5² = " + neg("−25"), "0ⁿ = 0 (n ≠ 0) e a⁰ = 1 (a ≠ 0)"],
                v: `<div class="big"><span class="pos">(−5)² = +25</span><br><span class="neg">−5² = −25</span><br><span class="neg">(−2)³ = −8</span></div>`
            },
            {
                t: "Expressões numéricas",
                n: "Para calcular uma expressão, resolvemos primeiro o que está dentro dos parênteses, depois dos colchetes e das chaves. Em cada nível, a ordem é: potenciação, depois multiplicação e divisão na ordem em que aparecem, e por fim adição e subtração. No exemplo, seis dividido por dois dá três, vinte e cinco vezes menos quatro dá menos cem, e a soma é menos noventa e sete.",
                i: ["Primeiro ( ), depois [ ], depois { }", "1º potenciação", "2º multiplicação e divisão, da esquerda para a direita", "3º adição e subtração, da esquerda para a direita"],
                v: `<div class="big" style="font-size:clamp(20px,3vw,34px)">6 ÷ (+2) + (−5)² · (−4)<br>= 3 + (+25)·(−4)<br>= 3 + (−100)<br><span class="neg">= −97</span></div>`
            },
            {
                t: "Plano cartesiano",
                n: "O plano cartesiano tem dois eixos perpendiculares: o horizontal, x, e o vertical, y. Eles se cruzam na origem, que é o par zero, zero. Cada ponto é um par ordenado: primeiro a abscissa, que diz quanto andar para a direita ou esquerda, depois a ordenada, que diz quanto subir ou descer. A ordem importa: quatro, dois é diferente de dois, quatro.",
                i: ["Eixos x (horizontal) e y (vertical), perpendiculares", "Origem: (0, 0)", "Par ordenado (abscissa, ordenada)", "(4, 2) e (2, 4) são pontos diferentes"],
                v: plano()
            },
            {
                t: "Sequências",
                n: "Sequência é uma lista ordenada de elementos, chamados termos: a um, a dois, e assim por diante, até o n-ésimo termo. Ela é finita quando tem um número limitado de termos, como os dias da semana, e infinita quando continua sem fim, como os números naturais. Uma sequência é recursiva quando cada termo é obtido a partir do anterior, seguindo uma lei de formação. Já a sequência dos números primos não tem regra assim, então é não recursiva.",
                i: ["Termos: a₁, a₂, a₃, …, aₙ; a ordem importa", "Finita: dias da semana · Infinita: (0, 1, 2, 3, …)", "Recursiva: 1º termo 3 e cada termo é o dobro do anterior", "Não recursiva: números primos (2, 3, 5, 7, 11, …)"],
                v: `<div class="chips"><span class="chip">3</span><span class="chip">6</span><span class="chip">12</span><span class="chip">24</span><span class="chip">48</span><span class="chip hl">…</span></div><p class="big" style="font-size:22px">× 2 a cada termo</p>`
            },
            {
                t: "Resumo final",
                n: "Para fechar: inteiros são os naturais e seus opostos. O módulo é a distância até zero. Na reta, quanto mais à direita, maior. Subtrair é somar o oposto. Na multiplicação, sinais iguais dão mais. Na potência, a base negativa depende do expoente. Respeite a ordem nas expressões, localize pontos por pares ordenados e descubra a lei de formação das sequências. Bons estudos!",
                i: ["ℤ = naturais + negativos", "Módulo = distância ao zero; oposto = simétrico", "Subtração = soma do oposto", "Sinais iguais (×, ÷) → positivo", "Ordem das operações e pares ordenados (x, y)", "Sequências: termos e lei de formação"],
                v: nl(-3, 3, [[-3, "−3", N], [0, "0", Y], [3, "+3", P]], [[-3, 3, "ℤ"]])
            }
        ];
        const Q = [
            { q: "Em qual situação um número negativo é útil?", o: ["Contar quantas pessoas há em uma sala", "Indicar uma dívida na conta bancária", "Numerar as páginas de um livro"], a: 1, e: "Dívidas, temperaturas abaixo de zero e profundidades são representadas por números negativos." },
            { q: "Um termômetro marca 4 °C e a temperatura cai 7 graus. Qual é a nova medida?", o: ["+3 °C", "−11 °C", "−3 °C"], a: 2, e: "4 − 7 = −3. Veja na reta: partimos de +4 e andamos 7 unidades para a esquerda. Quatro unidades levam até o zero e as outras 3 passam do zero, até −3.", ev: () => nl(-4, 5, [[4, "+4 °C", P], [-3, "−3 °C", N]], [[4, -3, "−7", N]]) },

        const H = ["Pense em algo que você deve, e não em algo que você tem.", "Se você tira mais do que tinha, o resultado fica abaixo de zero.", "Procure −4 na lista {0, 1, 2, 3, …}: ele aparece?", "Lembre: positivos ficam à direita do zero e negativos à esquerda.", "Calcule cada módulo primeiro: |−7| = 7 e |+3| = 3. Depois some.", "Oposto tem o mesmo módulo, mas o sinal contrário.", "O maior número é o que fica mais à direita na reta.", "Sinais diferentes: subtraia os módulos (6 − 2) e use o sinal do maior módulo.", "Troque a subtração por soma: o oposto de −5 é +5.", "Conte os fatores negativos: quantidade ímpar dá resultado negativo.", "Sem parênteses, só o 3 é elevado ao quadrado e o sinal de menos fica de fora.", "Pela ordem das operações, a multiplicação vem antes da adição.", "O 1º número do par é horizontal (x) e o 2º é vertical (y). Negativo em x vai para a esquerda.", "Comece em 5 e some 4 a cada passo: 5, 9, …", "Troque 3 − 5 por 3 + (−5): a subtração virou soma do oposto."];
        const X = [
            [["Qual sinal indica que um número é negativo?", ["O sinal de menos (−)", "O sinal de mais (+)", "O sinal de igual (=)"], 0, "Pense no sinal que aparece em −5 °C.", "Números negativos aparecem sempre com o sinal −; os positivos levam + ou nenhum sinal."], ["O zero é um número:", ["Positivo", "Negativo", "Nem positivo nem negativo"], 2, "O zero fica entre os positivos e os negativos na reta.", "O zero é a origem: separa os positivos dos negativos e não é nenhum dos dois."]],

            [["Quanto é (−1) + (−3)?", ["−4", "+4", "−2"], 0, "Sinais iguais: some os módulos e mantenha o sinal.", "1 + 3 = 4, com o sinal −: resultado −4."], ["Quanto é (+4) + (−4)?", ["+8", "−8", "0"], 2, "Os dois números são opostos.", "Números opostos somam zero."]],
            [["(+48) − (−85) é o mesmo que:", ["(+48) + (+85)", "(+48) + (−85)", "(−48) + (+85)"], 0, "Subtrair é somar o oposto do segundo número.", "O oposto de −85 é +85, então fica 48 + 85 = +133."], ["Quanto é (−9) − (+2)?", ["−7", "−11", "+11"], 1, "Some o oposto de +2, que é −2: (−9) + (−2).", "(−9) + (−2) = −11."]],
            [["Quanto é (−12) ÷ (+3)?", ["+4", "−4", "−36"], 1, "Sinais diferentes dão resultado negativo.", "12 ÷ 3 = 4 e os sinais são diferentes, então o resultado é −4 (pois (−4)·(+3) = −12)."], ["Por que não existe (+5) ÷ 0?", ["O resultado seria 0", "Nenhum número vezes 0 dá 5", "5 é pequeno demais"], 1, "Use a operação inversa: qual número vezes 0 resulta em 5?", "Qualquer número vezes 0 dá 0, nunca 5; a divisão por zero é impossível."]],
            [["Quanto é (−5)²?", ["−25", "+25", "−10"], 1, "(−5)² = (−5)·(−5): sinais iguais na multiplicação.", "(−5)·(−5) = +25."], ["Qual é o valor de (−2)³?", ["+8", "−8", "−6"], 1, "Expoente ímpar com base negativa dá resultado negativo.", "(−2)·(−2)·(−2) = −8."]],
            [["Quanto vale 6 ÷ (+2) + (−5)² · (−4)?", ["−97", "+97", "−100"], 0, "Faça a potência, depois × e ÷, e por último a soma.", "6 ÷ 2 = 3; 25 · (−4) = −100; 3 + (−100) = −97."], ["Com ( ), [ ] e { }, resolvemos primeiro:", ["As chaves { }", "Os colchetes [ ]", "Os parênteses ( )"], 2, "Começamos pelos símbolos mais internos.", "A ordem é parênteses, depois colchetes e depois chaves."]],

            [["A sequência dos dias da semana é:", ["Infinita", "Finita", "Sem ordem"], 1, "Conte quantos termos ela tem.", "Tem 7 termos, uma quantidade limitada: é finita."], ["Qual sequência é recursiva?", ["Números primos", "2, 4, 8, 16, … (dobro do anterior)", "Nomes dos alunos"], 1, "Procure a que tem uma regra ligando cada termo ao anterior.", "Cada termo é o dobro do anterior: 2, 4, 8, 16, …"]],
            [["Qual é a distância de −6 até a origem?", ["−6", "6", "0"], 1, "Distância é o módulo e nunca é negativa.", "|−6| = 6."], ["Quando o produto de dois inteiros é positivo?", ["Com sinais diferentes", "Com sinais iguais", "Sempre"], 1, "Lembre da tabela de sinais da multiplicação.", "Sinais iguais (+·+ ou −·−) dão resultado positivo."]]
        ];
        const QS = Q.map((q, i) => [{ ...q, d: H[i] }, ...X[i].map(([q, o, a, d, e]) => ({ q, o, a, d, e }))]);
        const AUD = "src/IMG/audioteste1.mp3";
        const $ = id => document.getElementById(id);
        let cur = 0, el = 0, playing = false, last = 0, spd = 1, started = false;
        S.forEach((s, k) => {
            s.d = s.n.length / 13 + 1; const b = document.createElement("i");
            b.tabIndex = 0; b.title = s.t; b.setAttribute("role", "button");
            b.setAttribute("aria-label", `Ir para a cena ${k + 1}: ${s.t}`);
            b.innerHTML = "<b></b>"; b.onclick = () => go(k);
            b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(k) } }; $("bar").appendChild(b)
        });
        let spk = false, cu = null;
        function stopSay() {
            cu = null; spk = false;
            if ("speechSynthesis" in window) speechSynthesis.cancel();
        }
        function say(txt) {
            try {
                stopSay();
                if ($("vox").checked && playing && ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window)) {
                    const u = new SpeechSynthesisUtterance(txt);
                    u.lang = "pt-BR"; u.rate = spd;

                        if (cu === u) { spk = false; cu = null; if (cur === cena) el = Math.max(el, S[cena].d) }
                    };
                    cu = u; spk = true; speechSynthesis.speak(u);
                }
            } catch (e) { spk = false; cu = null; }
        }
        function go(k) {
            cur = Math.max(0, Math.min(S.length - 1, k));
            el = 0;
            const s = S[cur];
            $("quiz").classList.add("hidden");
            $("gate").classList.add("hidden");
            $("stage").classList.toggle("s1", cur === 0);

            $("t").textContent = s.t;
            $("v").innerHTML = s.v;
            $("cap").textContent = s.n;
            $("items").innerHTML = s.i.map(h => `<li class="it">${h}</li>`).join("");
            $("count").textContent = `Cena ${cur + 1} de ${S.length}`;
            [...$("bar").children].forEach((b, j) => {

        function tick(now) {
            if (playing) {
                el += (now - last) / 1000 * spd;

                if (el >= s.d && (!spk || !$("vox").checked)) showGate();
            }
            last = now;
            const s = S[cur], n = s.i.length;
            document.querySelectorAll("li.it").forEach((li, k) =>

            if (atual) atual.firstChild.style.transform = `scaleX(${Math.min(1, el / s.d)})`;
            requestAnimationFrame(tick);
        }
        function showGate() {

        $("ok").onclick = () => { $("gate").classList.add("hidden"); showQ(0) };

        let hits = 0, tries = {}, qi = 0;

            if (cur === 0) {
                v.classList.remove("hidden");
                v.muted = $("vox").checked;
                if (reset) { try { v.currentTime = 0 } catch (e) { } }

                v.classList.add("hidden");

        function showQ(i = 0) {
            qi = i; const q = QS[cur][qi], b = $("quiz"); playing = false; $("pp").textContent = "Continuar"; try { stopSay() } catch (e) { } $("vid").pause();
            b.classList.remove("hidden");
            const lbl = qi < 2 ? "Próxima pergunta" : cur < S.length - 1 ? "Próxima cena" : "Finalizar";
            b.innerHTML = `<p class="qk">Pergunta ${qi + 1} de 3 · para refletir</p><h2>${q.q}</h2>${cur === 0 && qi === 0 ? `<audio id="qa" controls autoplay preload="metadata" src="${AUD}" class="w-full max-w-[560px]"></audio>` : ""}` + q.o.map((o, k) => `<button class="opt" data-k="${k}">${o}</button>`).join("") + `<p class="fb" id="fb"></p><button id="qn" class="hidden">${lbl}</button>`;
            b.querySelectorAll(".opt").forEach(x => x.onclick = () => pick(x, +x.dataset.k, q));
            $("qn").onclick = nextQ;
            if ($("vox").checked && !(cur === 0 && qi === 0)) { try { const u = new SpeechSynthesisUtterance(q.q); u.lang = "pt-BR"; u.rate = spd; speechSynthesis.speak(u) } catch (e) { } }
            b.querySelector(".opt").focus();
        }
        function pick(btn, k, q) {
            const key = cur + "-" + qi; tries[key] = (tries[key] || 0) + 1;
            if (k !== q.a) { btn.disabled = true; btn.classList.add("no"); $("fb").innerHTML = "<b class='neg'>Ainda não.</b> Dica: " + q.d + " Tente outra opção."; return }
            if (tries[key] === 1) hits++;
            document.querySelectorAll(".opt").forEach((x, j) => { x.disabled = true; if (j === q.a) x.classList.add("ok") });
            $("fb").innerHTML = "<b class='pos'>Isso mesmo!</b> " + q.e + (q.ev ? `<div class="mx-auto mt-2 w-full max-w-[560px] [&_svg]:h-auto [&_svg]:w-full">${q.ev()}</div>` : "");
            $("qn").classList.remove("hidden"); $("qn").focus(); $("score").textContent = `Acertos de primeira: ${hits}/${S.length * 3}`;
        }
        function nextQ() {
            if (qi < 2) { showQ(qi + 1); return }
            if (cur < S.length - 1) { playing = true; $("pp").textContent = "Pausar"; go(cur + 1) }
            else { $("quiz").classList.add("hidden"); $("pp").textContent = "Rever"; $("cap").textContent = `Fim! Você acertou de primeira ${hits} de ${S.length * 3} perguntas.` }
        }
        function play() {
            playing = true; $("pp").textContent = "Pausar";
            vidSync(false);
            if ($("vox").checked) {
                try {
                    if ("speechSynthesis" in window && speechSynthesis.paused) speechSynthesis.resume();
                    else say(S[cur].n);
                } catch (e) { }
            }
        }
        function pause() {
            playing = false; $("pp").textContent = "Continuar";
            $("vid").pause();
            try { if ("speechSynthesis" in window) speechSynthesis.pause() } catch (e) { }
        }
        $("go").onclick = () => { $("start").classList.add("hidden"); started = true; playing = true; go(0) };
        $("pp").onclick = () => { if (!$("quiz").classList.contains("hidden")) return; if (!$("gate").classList.contains("hidden")) { $("ok").click(); return } if ($("pp").textContent === "Rever") { hits = 0; tries = {}; $("score").textContent = "Acertos de primeira: 0/" + S.length * 3; go(0); play() } else playing ? pause() : play() };
        $("prev").onclick = () => go(el > 3 ? cur : cur - 1);
        $("next").onclick = () => go(cur + 1);
        $("spd").onchange = e => { spd = +e.target.value; if (started) say(S[cur].n) };
        $("vox").onchange = () => {
            $("vid").muted = $("vox").checked;
            if ($("vox").checked && playing) say(S[cur].n);
            else try { stopSay() } catch (e) { }
        };
        document.addEventListener("keydown", e => {
            if (!started || e.altKey || e.ctrlKey || e.metaKey) return;
            const tag = e.target.tagName;
            if (["INPUT", "TEXTAREA", "SELECT"].includes(tag) || e.target.isContentEditable) return;
            if (e.key === " " && tag !== "BUTTON") {
                e.preventDefault(); $("pp").click(); return;
            }
            if (!$("quiz").classList.contains("hidden")) return;
            if (e.key === "ArrowRight") go(cur + 1);
            if (e.key === "ArrowLeft") go(cur - 1);
        });
        $("score").textContent = "Acertos de primeira: 0/" + S.length * 3; go(0); requestAnimationFrame(t => { last = t; tick(t) });
    </script>
