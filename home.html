<!DOCTYPE html>

<html class="overscroll-x-none" lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Início</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body class="overscroll-x-none bg-white min-h-screen">


    <!-- CABEÇALHO -->
    <header class="flex flex-col sm:flex-row
               items-center sm:items-baseline
               p-6 sm:p-10
               gap-5 sm:gap-0">

        <!-- Logo -->
        <div class="w-24 h-24
                   sm:w-32 sm:h-32
                   bg-yellow-400
                   border-4 border-[#303638]
                   rounded-[20px]
                   rotate-[-5deg]
                   flex items-center justify-center">

            <i class="fa-solid fa-graduation-cap
                       text-[#303638]
                       text-3xl sm:text-4xl
                       rotate-[5deg]">
            </i>

        </div>


        <!-- Nome -->
        <h1 class="text-[#ed3945]
                   text-3xl sm:text-4xl
                   font-bold
                   sm:pl-9
                   text-center sm:text-left">

            Aprendendo XYZ

        </h1>

    </header>



    <!-- DESAFIO -->
    <section class="w-[90%] sm:w-3/4
               min-h-40
               bg-amber-200
               flex flex-col
               justify-center
               border-4 border-black
               rounded-2xl
               mx-auto
               px-4 py-6">

        <div class="flex justify-center
                   text-center
                   font-bold
                   text-xl sm:text-2xl">

            <h1>
                Qual o desafio de hoje?
            </h1>

        </div>


        <div class="flex justify-center
                   text-center
                   pt-2
                   text-sm sm:text-base">

            <h1>
                Escolha uma disciplina para trilhar seu conhecimento!
            </h1>

        </div>

    </section>



    <!-- DISCIPLINAS -->
    <section class="w-[90%] sm:w-3/4
               mx-auto
               pt-8 sm:pt-10
               grid grid-cols-1 sm:grid-cols-2
               gap-4">


        <!-- MATEMÁTICA -->
        <button onclick="trocar()" class="w-full
                   bg-[rgb(200,0,190)]
                   border-4 border-[#303638]
                   rounded-[20px]
                   flex flex-col
                   items-center
                   justify-center
                   h-32
                   hover:brightness-95
                   active:translate-y-1
                   transition">

            <i class="fa-solid fa-calculator
                       bg-white
                       rounded-xl
                       text-4xl
                       p-1">
            </i>

            <h1 class="pt-1
                       text-lg sm:text-xl
                       text-white">

                Matemática

            </h1>

        </button>



        <!-- PORTUGUÊS -->
        <button onclick="trocar()" class="w-full
                   bg-cyan-400
                   border-4 border-[#303638]
                   rounded-[20px]
                   flex flex-col
                   items-center
                   justify-center
                   h-32
                   hover:brightness-95
                   active:translate-y-1
                   transition">

            <i class="fa-solid fa-book
                       bg-white
                       rounded-xl
                       text-4xl
                       p-1">
            </i>

            <h1 class="pt-1
                       text-lg sm:text-xl
                       text-white">

                Português

            </h1>

        </button>


    </section>



    <script src="./src/JS/script.js"></script>

</body>

</html>
