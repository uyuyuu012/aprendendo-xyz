<!DOCTYPE html>
<html class="overscroll-x-none" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Série</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="overscroll-x-none bg-white min-h-screen">

    <div class="flex min-h-screen">

        <!-- Conteúdo -->
        <div id="conteudo" class="flex-1 transition-all duration-300">

            <header class="flex flex-wrap items-baseline p-10">

                <!-- Logo -->
                <div
                    class="w-32 h-32 bg-yellow-400 border-4 border-[#303638] rounded-[20px] rotate-[-5deg] flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-[#303638] text-4xl rotate-[5deg]"></i>
                </div>

                <!-- Nome -->
                <h1 class="text-[#ed3945] text-4xl font-bold mt-5 pl-9">
                    Aprendendo XYZ
                </h1>

            </header>

            <section id="unidades">
                <button onclick="abrirMenu()"
                    class="h-20 w-1/2 mx-auto bg-red-600 border-4 border-[#303638] rounded-[20px] flex items-center justify-center">

                    <h1 class="text-white text-xl">
                        Unidade 1 - Sistemas de numeração e números naturais
                    </h1>

                </button>
            </section>

        </div>

        <!-- Aside -->
        <aside id="aside" class="w-0 overflow-hidden bg-gray-400 transition-all duration-300">

            <div class="w-80 p-5">

                <h2 class="text-2xl text-white mb-5">
                    Menu
                </h2>

                <button onclick="trocar3()"
                    class="w-full min-h-20 bg-red-600 border-4 border-[#303638] rounded-[20px] flex items-center justify-center p-3">

                    <h1 class="text-white text-xl text-center">
                        Base e extrutura
                    </h1>

                </button>

            </div>

        </aside>

    </div>


    <!-- Botão -->



    <script src="./src/JS/script.js"></script>

</body>

</html>
