<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="overscroll-x-none bg-white min-h-screen">
    <header class="flex flex-wrap items-baseline p-5 md:p-10">

        <!-- Logo -->
        <button onclick="home()"
            class="w-24 h-24 md:w-32 md:h-32 bg-yellow-400 border-4 border-[#303638] rounded-[20px] rotate-[-5deg] flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-[#303638] text-3xl md:text-4xl rotate-[5deg]"></i>
        </button>

        <!-- Nome -->
        <h1 class="text-[#ed3945] text-2xl md:text-4xl font-bold mt-5 flex justify-baseline pl-5 md:pl-9">
            Aprendendo XYZ -
        </h1>

    </header>

    <section id="video" class="mx-auto w-full md:w-1/2 flex flex-col items-center gap-6 p-5">

        <!-- VÍDEO -->
        <video id="meuVideo" preload="auto" class="w-full rounded-lg shadow-lg" autoplay>
            <source src="#video-abertura" type="video/mp4">
        </video>

        <button id="botao-proximo" onclick="trocar4()"
            class="w-full md:w-1/4 bg-blue-700 border-4 border-[#303638] rounded-[20px] flex items-center justify-center h-20 md:h-24">
            <h1 id="btn-a" class="text-xl md:text-2xl text-white">
                Ir para seleção de aulas
            </h1>
        </button>

    </section>
</body>

</html>
