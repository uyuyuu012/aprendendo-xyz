<!DOCTYPE html>
<html class="overscroll-x-none" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Série</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="overscroll-x-none bg-white min-h-screen">
    <header class="flex flex-wrap items-baseline p-10">

        <!-- Logo -->
        <div
            class="w-32 h-32 bg-yellow-400 border-4 border-[#303638] rounded-[20px] rotate-[-5deg] flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-[#303638] text-4xl rotate-[5deg]"></i>
        </div>

        <!-- Nome -->
        <h1 class="text-[#ed3945] text-4xl font-bold mt-5 flex justify-baseline pl-9">
            Aprendendo XYZ
        </h1>
    </header>
    <section class="w-3/4 mx-auto pt-10 flex gap-4">

        <button class="w-1/2 bg-red-600 border-4 border-[#303638] rounded-[20px] flex flex-col items-center justify-center h-32">
            <h1 class=" text-white rounded-xl text-4xl p-1">6°</h1>
            <h1 class="pt-1 text-xl text-white">Fundamental I</h1>
        </button>

        <button class="w-1/2 bg-cyan-400 border-4 border-[#303638] rounded-[20px] flex flex-col items-center justify-center h-32">
            <h1 class=" text-white rounded-xl text-4xl p-1">7°</h1>
            <h1 class="pt-1 text-xl text-white">Fundamental I</h1>
        </button>

    </section>
    <section class="w-3/4 mx-auto pt-10 flex gap-4">

        <button class="w-1/2 bg-green-600 border-4 border-[#303638] rounded-[20px] flex flex-col items-center justify-center h-32">
            <h1 class="text-white rounded-xl text-4xl p-1">8°</h1>
            <h1 class="pt-1 text-xl text-white">Fundamental II</h1>
        </button>

        <button class="w-1/2 bg-orange-400 border-4 border-[#303638] rounded-[20px] flex flex-col items-center justify-center h-32">
            <h1 class=" text-white rounded-xl text-4xl p-1">9°</h1>
            <h1 class="pt-1 text-xl text-white">Fundamental II</h1>
        </button>

    </section>
    
</body>
