<!DOCTYPE html>
<html class="overscroll-x-none" lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unidades</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="overscroll-x-none bg-white min-h-screen">

    <div class="flex min-h-screen relative">

        <!-- Conteúdo -->
        <div id="conteudo" class="flex-1 transition-all duration-300">

            <!-- Cabeçalho -->
            <header class="flex flex-wrap items-center p-5 sm:p-8 lg:p-10 gap-5">

                <!-- Logo -->
                <button onclick="home()"
                    class="w-24 h-24 md:w-32 md:h-32 bg-yellow-400 border-4 border-[#303638] rounded-[20px] rotate-[-5deg] flex items-center justify-center">
                    <i class="fa-solid fa-graduation-cap text-[#303638] text-3xl md:text-4xl rotate-[5deg]"></i>
                </button>

                <!-- Nome -->
                <h1 class="text-[#ed3945]
                    text-2xl sm:text-3xl lg:text-4xl
                    font-bold">
                    Aprendendo XYZ - Sólidos geométricos
                </h1>

            </header>


            <!-- Unidades -->
            <section id="unidades" class="px-5 sm:px-8 lg:px-10">

                <!-- Unidade 1 -->
                <div class="pb-6">

                    <button id="unidade1" onclick="abrirMenu2(1)" class="h-auto min-h-20 w-full lg:w-1/2
                        mx-auto px-4 py-4
                        bg-red-600 border-4 border-[#303638]
                        rounded-[20px]
                        flex items-center justify-center">

                        <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                            Teoria
                        </h1>

                    </button>

                </div>


                <!-- Unidade 2 -->
                <div class="pb-6">

                    <button id="unidade2" onclick="solidos2()" class="h-auto min-h-20 w-full lg:w-1/2
                        mx-auto px-4 py-4
                        bg-red-600 border-4 border-[#303638]
                        rounded-[20px]
                        flex items-center justify-center">

                        <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                            Atividade guiada 1
                        </h1>

                    </button>

                </div>


                <!-- Unidade 3 -->
                <div class="pb-6">

                    <button id="unidade3" onclick="" class="h-auto min-h-20 w-full lg:w-1/2
                        mx-auto px-4 py-4
                        bg-red-600 border-4 border-[#303638]
                        rounded-[20px]
                        flex items-center justify-center">

                        <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                            Atividade guiada 2
                        </h1>

                    </button>

                </div>


                <!-- Unidade 4 -->
                <div class="pb-6">

                    <button id="unidade4" onclick="" class="h-auto min-h-20 w-full lg:w-1/2
                        mx-auto px-4 py-4
                        bg-red-600 border-4 border-[#303638]
                        rounded-[20px]
                        flex items-center justify-center">

                        <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                            Atividade guiada 3
                        </h1>

                    </button>

                </div>


                <!-- Unidade 5 -->
                <div class="pb-6">

                    <button id="unidade5" onclick="" class="h-auto min-h-20 w-full lg:w-1/2

                <!-- Unidade 7 -->
                <div class="pb-6">

                    <button id="unidade7" onclick="trocarperguntas()" class="h-auto min-h-20 w-full lg:w-1/2
                        mx-auto px-4 py-4
                        bg-red-600 border-4 border-[#303638]
                        rounded-[20px]
                        flex items-center justify-center">

                        <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                            Atividade 1
                        </h1>

                    </button>

                </div>


                <!-- Unidade 8 -->
                <div class="pb-6">

                    <button id="unidade8" onclick="trocarperguntas2()" class="h-auto min-h-20 w-full lg:w-1/2

                            mx-auto px-4 py-4

                            rounded-[20px]

                    <h1 class="text-white text-base sm:text-lg lg:text-xl text-center">
                        Atividade 3
                    </h1>

                </button>

            </div>

            </section>

        </div>
            


        <!-- Menu lateral -->
        <aside id="aside" class="fixed top-0 right-0 z-50
            w-0 h-screen
            overflow-hidden
            bg-gray-400
            transition-all duration-300">

            <div class="w-full h-full p-5 sm:p-8 overflow-y-auto">

                <!-- Cabeçalho do menu -->
                <div class="flex items-center justify-between mb-6">

                    <h2 class="text-2xl sm:text-3xl text-white font-bold">
                        Menu
                    </h2>


                    <!-- Botão fechar -->
                    <button onclick="abrirMenu()" class="w-12 h-12
                        bg-red-600
                        border-4 border-[#303638]
                        rounded-full
                        flex items-center justify-center
                        hover:bg-red-700 transition">

                        <i class="fa-solid fa-arrow-right text-white"></i>

                    </button>

                </div>



                <div id="botoesMenu"></div>

            </div>

        </aside>

    </div>


    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>


    <!-- Seu JavaScript -->
    <script src="./src/JS/script.js"></script>

</html>
